# Builds and tests the Windows version on a fresh Windows machine, and keeps
# the installer as a download. The Mac version is built by hand, on a Mac.
name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Test the page and the pipeline
        run: npm test

      - name: Test the shell
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: triglosa-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
