name: Something does not work
description: The app did something wrong, or did nothing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: text
    attributes:
      label: The text you read
      description: The sentence or word, if it is not private. Many problems only show up with one particular text.
  - type: input
    id: languages
    attributes:
      label: Your languages and levels
      placeholder: "German; Spanish B1, English C1"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI model
      description: The model name from the settings, and whether it runs in the cloud or locally. "None" is a fine answer.
      placeholder: "deepseek/deepseek-v4.1-flash on OpenRouter"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Triglosa version and system
      placeholder: "Triglosa 0.3.0, Windows 11 24H2 — or macOS 26.4"
    validations:
      required: true
