name: Something does not work
description: The app did something wrong, or did nothing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: text
    attributes:
      label: The text you read
      description: The sentence or word, if it is not private. Many problems only show up with one particular text.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        In Triglosa's settings under "About Triglosa", click "Copy diagnostics" and paste it here.
        It holds the version, system, languages and AI model, none of your texts and not your key.
        In a version without that button: your languages and levels, the AI model, the Triglosa
        version and the system.
      render: text
      placeholder: |
        Triglosa 0.4.3
        System: macOS 26.4 (aarch64)
        Languages: de, es (B1), en (C1)
        ...
    validations:
      required: true
