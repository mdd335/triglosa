[package]
name = "triglosa"
version = "0.2.0"
description = "Read in a foreign language with the words worth learning explained"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

# The binary's name is what macOS shows in the dock while developing — a
# bundled build takes productName from tauri.conf.json, but `tauri dev` runs
# this file directly. The package name stays lowercase; Cargo expects that.
[[bin]]
name = "Triglosa"
path = "src/main.rs"

[lib]
name = "triglosa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
